<html lang="en">

<title>DingerLab — Stadium Night</title>

<style>
  :root{
    --bg:#0a0c11; --surface:#13161e; --surface2:#0c0e14; --panel:#0f1218;
    --text:#eef1f6; --dim:#8b94a6; --muted:#7b8597; --faint:#5f6878;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.08);
    --ac:#ff8a4c; --ac2:#ff4d7d; --pos:#35d0c0; --gold:#ffc24d; --pink:#ff5ea8; --purple:#a78bfa; --warn:#ff6b6b;
    --pad:18px;
  }
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  h1,h2,h3{font-family:"Space Grotesk",sans-serif}
  button{font-family:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:20px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,138,76,.5)}
  @keyframes dlpulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes dlrise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes dlslide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  @keyframes dlspin{to{transform:rotate(360deg)}}
  .rise{animation:dlrise .35s ease both}
  .hovcard{transition:transform .15s,border-color .15s}
  .hovcard:hover{border-color:rgba(255,138,76,.55)!important;transform:translateY(-3px)}
  .hovrow{transition:border-color .14s}
  .hovrow:hover{border-color:rgba(255,138,76,.45)!important}
  .btnp{transition:filter .14s}
  .btnp:hover{filter:brightness(1.08)}
  .btng{transition:border-color .14s,color .14s}
  .btng:hover{border-color:var(--ac)!important;color:var(--text)!important}
  .navbtn{transition:background .14s,color .14s}
  .navbtn:hover{background:rgba(255,255,255,.05)!important;color:var(--text)!important}
  .chip{cursor:pointer;transition:background .14s,border-color .14s,color .14s}
  .spin{display:inline-block;animation:dlspin .8s linear infinite}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:#161a24;border:1px solid var(--line2);color:var(--text);padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;z-index:120;transition:opacity .2s,transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* === RESPONSIVE: TABLET (max 1180px) === */
  @media(max-width:1180px){
    .bodygrid{grid-template-columns:200px minmax(0,1fr)!important}
    .slipaside{position:static!important;height:auto!important;border-left:none!important;border-top:1px solid var(--line2)!important;width:auto!important;padding:18px 16px!important;align-self:stretch!important;grid-column:1/-1!important}
  }
  /* === RESPONSIVE: MOBILE (max 900px) === */
  @media(max-width:900px){
    .bodygrid{display:block!important}
    /* Header: compact + wrap */
    header{padding:10px 12px!important;gap:8px!important;flex-wrap:wrap!important}
    header > div[style*="width:38px"]{width:32px!important;height:32px!important;font-size:16px!important}
    header div[style*="font-size:19px"]{font-size:16px!important}
    header button{padding:8px 11px!important;font-size:12.5px!important;gap:5px!important}
    /* Hide date chip & version chip (both share var(--surface) bg in header) */
    header > div[style*="background:var(--surface);border:1px solid var(--line)"]{display:none!important}
    /* Trim live chip */
    header > div[style*="background:rgba(53,208,192,.08)"]{padding:5px 9px!important}
    /* Rail nav -> horizontal scrolling tab bar */
    .railnav{
      position:sticky!important; top:54px!important; z-index:30!important;
      flex-direction:row!important; padding:6px 8px!important;
      border-right:none!important; border-bottom:1px solid var(--line2)!important;
      background:rgba(10,12,17,.93)!important; backdrop-filter:blur(12px)!important;
      overflow-x:auto!important; overflow-y:hidden!important;
      gap:4px!important; align-self:auto!important; flex-wrap:nowrap!important;
      -webkit-overflow-scrolling:touch;
    }
    .railnav > div{display:none!important}
    .railnav .navbtn{flex:0 0 auto!important;padding:8px 12px!important;font-size:12.5px!important;border-radius:9px!important;white-space:nowrap!important}
    .railnav .navbtn > span:first-child{display:none!important}
    /* Section padding */
    .rise{padding:0 2px!important}
    main{padding:14px 12px!important}
    /* Typography */
    h1{font-size:22px!important;letter-spacing:-.01em!important}
    h2{font-size:18px!important}
    h3{font-size:15px!important}
    /* Headblock subtitle width */
    p[style*="max-width:600px"],p[style*="max-width:560px"],p[style*="max-width:740px"]{max-width:100%!important;font-size:13px!important}
    /* Multi-col stat grids -> 2 columns */
    div[style*="grid-template-columns:repeat(5,1fr)"],
    div[style*="grid-template-columns:repeat(4,1fr)"]{grid-template-columns:repeat(2,1fr)!important}
    /* 3-col grids -> 2 columns (or 1 for big tiles) */
    div[style*="grid-template-columns:repeat(3,1fr)"]{grid-template-columns:1fr!important}
    div[style*="grid-template-columns:1fr 1fr 1fr"]{grid-template-columns:1fr!important}
    /* Two-column splits -> stacked */
    div[style*="grid-template-columns:minmax(0,1.05fr)"],
    div[style*="grid-template-columns:minmax(0,.95fr)"],
    div[style*="grid-template-columns:minmax(0,1.3fr)"],
    div[style*="grid-template-columns:minmax(0,1.4fr)"],
    div[style*="grid-template-columns:minmax(0,.7fr)"],
    div[style*="grid-template-columns:minmax(0,.6fr)"],
    div[style*="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"],
    div[style*="grid-template-columns:minmax(0,1fr) minmax(0,.95fr)"]{grid-template-columns:1fr!important}
    /* Auto-fill card grids -> single column */
    div[style*="minmax(258px"],
    div[style*="minmax(300px"],
    div[style*="minmax(220px"],
    div[style*="minmax(150px"]{grid-template-columns:1fr!important}
    /* Slip aside: inline at bottom, full width */
    .slipaside{
      position:static!important; height:auto!important;
      border-left:none!important; border-top:1px solid var(--line2)!important;
      width:auto!important; padding:18px 14px!important; overflow:visible!important;
      align-self:stretch!important;
    }
    /* Player drawer: full width */
    div[style*="width:min(460px,94vw)"]{width:100%!important;border-left:none!important}
    /* Drawer header h2 */
    div[style*="width:min(460px,94vw)"] h2{font-size:20px!important}
    /* Tables: smaller, allow scroll */
    table{font-size:12px!important}
    table[style*="min-width:760px"]{min-width:600px!important}
    /* Disable hover lift on touch */
    .hovcard:hover{transform:none!important}
    /* Toast position */
    #toast{left:12px!important;right:12px!important;transform:translateY(20px)!important;bottom:14px!important;text-align:center;font-size:12.5px}
    #toast.show{transform:translateY(0)!important}
    /* Inputs: prevent iOS zoom */
    input,select,textarea{font-size:16px!important}
  }
  /* === RESPONSIVE: SMALL MOBILE (max 480px) === */
  @media(max-width:480px){
    header{padding:8px 10px!important}
    /* Hide "MLB HR INTELLIGENCE" subtitle under logo */
    header div[style*="letter-spacing:.04em"]{display:none!important}
    /* Even the live chip text can be tight */
    header > div[style*="background:rgba(53,208,192,.08)"]{font-size:10.5px!important;padding:4px 7px!important}
    h1{font-size:20px!important}
    h2{font-size:17px!important}
    /* 2-col grids stay 2-col but tighter gaps */
    div[style*="grid-template-columns:repeat(2,1fr)"]{gap:8px!important}
    /* Section eyebrow */
    div[style*="letter-spacing:.14em"]{font-size:10px!important}
    /* KPI numbers slightly smaller */
    div[style*="font-size:30px;font-weight:700"]{font-size:22px!important}
  }
</style>

function genBuilds(){
  var hrOnly=(S.builder.markets==="HR only");
  var n=S.builder.legs||3;
  var style=S.builder.style||"Balanced";
  var cands=[];
  Object.keys(PLAYERS).forEach(function(id){
    var p=PLAYERS[id]; if(!p||!p.markets) return;
    var team=((p.line||"").split(" ")[0])||id;
    p.markets.forEach(function(m){
      if(hrOnly && m.label!=="HR") return;
      var pr=(typeof m.prob==="number")?m.prob:impliedFromAm(m.odds);
      if(!pr||pr<=0) return;
      var dec=amToDec(m.odds); if(!dec||dec<=1) return;
      var edge=pr-impliedFromAm(m.odds);
      cands.push({id:id,name:p.name,team:team,label:m.label,odds:m.odds,prob:pr,dec:dec,edge:edge});
    });
  });
  if(cands.length<n) return [];
  if(style==="Safe") cands.sort(function(a,b){return b.prob-a.prob;});
  else if(style==="Longshot") cands.sort(function(a,b){return a.prob-b.prob;});
  else cands.sort(function(a,b){return b.edge-a.edge;});
  var cards=[]; var usedGlobal={};
  for(var c=0;c<4;c++){
    var legs=[]; var teams={};
    for(var i=0;i<cands.length && legs.length<n;i++){
      var x=cands[i]; var key=x.id+"|"+x.label;
      if(usedGlobal[key]) continue;
      if(teams[x.team]) continue;
      legs.push(x); teams[x.team]=1; usedGlobal[key]=1;
    }
    if(legs.length<n) break;
    var dec=1, win=1, esum=0;
    legs.forEach(function(l){ dec*=l.dec; win*=l.prob; esum+=l.edge; });
    var ev=win*dec-1;
    var grade="C", gradec=WARN;
    if(ev>=0.10){grade="A";gradec=AC;} else if(ev>=0.06){grade="A-";gradec=AC;} else if(ev>=0.03){grade="B+";gradec=AC;} else if(ev>=0){grade="B";gradec=AC;}
    var avgEdge=(esum/legs.length)*100;
    cards.push({
      title:n+"-leg \u00b7 "+style,
      sub:n+" games \u00b7 "+(hrOnly?"HR market":"Mixed markets"),
      odds:fmtAm(decToAm(dec)),
      ev:"EV "+(ev>=0?"+":"\u2212")+Math.abs(ev*100).toFixed(1)+"%",
      evc:(ev>=0?POS:WARN),
      legs:legs.map(function(l){return [l.name+" \u2014 "+l.label, l.odds];}),
      rawLegs:legs.map(function(l){return {id:l.id,name:l.name,label:l.label,odds:l.odds,prob:l.prob};}),
      win:(win*100).toFixed(1)+"%",
      edge:(avgEdge>=0?"+":"\u2212")+Math.abs(avgEdge).toFixed(1),
      edgec:(avgEdge>=0?POS:WARN),
      grade:grade, gradec:gradec,
      ret:"$"+Math.round(10*dec)
    });
  }
  return cards;
}

function recompute(){ var dec=1,prob=1; S.slip.forEach(function(l){ var d=amToDec(l.american); dec*=d; prob*=(l.prob!=null?l.prob:impliedFromAm(l.american)); }); return {dec:dec,prob:prob}; }
function kellyAmt(r){ if(S.slip.length===0) return 0; var edge=(r.prob*(r.dec-1)-(1-r.prob)); var f=edge/(r.dec-1); return Math.max(0,0.25*100*f); }
/* ===================== QUICKPICK / PIKKIT ===================== */
function quickPickLegText(l){
  var mk=String(l.mk||"").toLowerCase();
  var label=String(l.market||"").toLowerCase();
  var n=l.name||"";
  if(mk==="hr"||/home\s*run|^hr$/.test(label)) return "Over 0.5 "+n+" Home Runs";
  if(mk==="hits2"||/2\+?\s*hit/.test(label))   return "Over 1.5 "+n+" Hits";
  if(mk==="tb"||/tb|total\s*bas/.test(label))  return "Over 1.5 "+n+" Total Bases";
  if(mk==="rbi"||/rbi/.test(label))            return "Over 0.5 "+n+" RBIs";
  if(mk==="hits"||/hit/.test(label))           return "Over 0.5 "+n+" Hits";
  return n+" "+(l.market||"HR");
}

/* ===================== ODDS / SLATE WIRING ===================== */
var LIVEODDS={};
var NAMEIDX={};
Object.keys(PLAYERS).forEach(function(id){NAMEIDX[norm(PLAYERS[id].name)]=id;});
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[^a-z]/g,"");}
function parseAm(v){ if(v==null) return null; if(typeof v==="number") return v; var s=String(v).replace(/\u2212/g,"-").replace(/\+/g,""); var n=parseFloat(s); return isNaN(n)?null:n; }
function pad2(n){return (n<10?"0":"")+n;}
function mergeOdds(payload){
  var ev=payload&&payload.events; if(!ev||!ev.length) return 0; var c=0;
  ev.forEach(function(e){ (e.odds||[]).forEach(function(o){
    var mk=String(o.market||"").toLowerCase(); var side=o.selection&&o.selection.side; var line=o.selection&&o.selection.line;
    if(/home\s*run/.test(mk)&&side==="Over"&&(line===0.5||line==="0.5")){ var nm=norm(o.player&&o.player.name); var am=parseAm(o.price); if(nm&&am!=null){ c++; if(!LIVEODDS[nm]||amToDec(am)>amToDec(LIVEODDS[nm])) LIVEODDS[nm]=am; } }
  }); });
  Object.keys(LIVEODDS).forEach(function(nm){ var id=NAMEIDX[nm]; if(id) PLAYERS[id].best=fmtAm(LIVEODDS[nm]); });
  return c;
}
function refreshOdds(){
  if(S.loading) return; S.loading=true; render();
  var books=["draftkings","fanatics","betmgm","caesars"]; var base=CFG.backend+"/api/oddsblaze"; var found=0;
  Promise.all(books.map(function(b){return fetch(base+"?sportsbook="+b+"&league=mlb",{mode:"cors"}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});})).then(function(results){
    results.forEach(function(p){ if(p) found+=mergeOdds(p); });
    if(found>0){ S.oddsLive=true; toast("Refreshed odds across 4 books · "+found+" HR markets priced"); }
    else { toast("Backend reachable but no odds returned — check the OddsBlaze key in Render"); }
    S.loading=false; render();
  }).catch(function(){ toast("Could not reach the odds backend (CORS or offline)"); S.loading=false; render(); });
}
function loadSlate(){
  if(S.loading) return; S.loading=true; render();
  var d=new Date(); var ds=d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
  fetch("https://statsapi.mlb.com/api/v1/schedule?sportId=1&date="+ds,{mode:"cors"}).then(function(r){return r.json();}).then(function(j){
    var n=(j.dates&&j.dates[0]&&j.dates[0].games)?j.dates[0].games.length:0; S.gameCount=n;
    toast(n?("Loaded "+n+" games scheduled for today"):"No games scheduled today"); S.loading=false; render();
  }).catch(function(){ toast("Could not reach the MLB schedule feed (offline or blocked)"); S.loading=false; render(); });
}

var LIVE_TRACKER=null, LIVE_META=null;
function applyBoard(b){
  if(!b||b.source!=="live") return false;
  var COL={AC:AC,AC2:AC,POS:POS,GOLD:GOLD,PINK:PINK,PURPLE:PURPLE,WARN:WARN};
  if(b.players&&Object.keys(b.players).length){
    Object.keys(b.players).forEach(function(id){ var p=b.players[id];
      p.fadeColor=COL[p.fadeColor]||p.fadeColor||POS;
      (p.profile||[]).forEach(function(r){ if(COL[r[3]]) r[3]=COL[r[3]]; });
    });
    PLAYERS=b.players;
  }
  if(b.starCards&&b.starCards.length) STAR_CARDS=b.starCards.filter(function(id){return PLAYERS[id];});
  if(b.kpis&&b.kpis.length){ b.kpis.forEach(function(k){ if(k.sc&&COL[k.sc])k.sc=COL[k.sc]; if(k.vc&&COL[k.vc])k.vc=COL[k.vc]; }); KPIS=b.kpis; }
  if(b.combos) COMBOS=b.combos;
  if(b.dataRows&&b.dataRows.length) DATAROWS=b.dataRows;
  if(b.games&&b.games.length){ b.games.forEach(function(g){ (g.players||[]).forEach(function(pp){ if(pp.evc&&COL[pp.evc])pp.evc=COL[pp.evc]; if(!pp.id||!PLAYERS[pp.id])pp.id=null; }); }); GAMES=b.games; }
  if(b.steam&&b.steam.length){ b.steam.forEach(function(s){ if(s.tagc&&COL[s.tagc]) s.tagc=COL[s.tagc]; }); STEAM=b.steam; }

function dlAgo(ms){
  if(!ms) return "never";
  var s=Math.max(0,Math.round((Date.now()-ms)/1000));
  if(s<5) return "just now";
  if(s<60) return s+"s ago";

}

/* ===================== EVENTS ===================== */
function dlMkCode(label){
  var s=String(label||"").toLowerCase();
  if(s==="hr"||/home\s*run/.test(s)) return "hr";
  if(/2\+?\s*hit/.test(s)) return "hits2";
  if(/tb|total\s*bas/.test(s)) return "tb";
  if(/rbi/.test(s)) return "rbi";
  if(/hit/.test(s)) return "hits";
  return "hr";
}
function dlNowMs(){ return Date.now(); }
function dlDec(am){ var a=parseAm(am); if(a==null||a===0) return 1; return a>0?(1+a/100):(1+100/(-a)); }
function dlLegData(legs){
  return (legs||[]).map(function(l){
    var pp=(l.id&&typeof PLAYERS!=="undefined"&&PLAYERS)?PLAYERS[l.id]:null;
    return { player:(l.name||""), mk:dlMkCode(l.market||l.label||"hr"), gamePk:(l.gamePk!=null?l.gamePk:(pp&&pp.gamePk!=null?pp.gamePk:null)), date:(l.date||(pp&&pp.mlbDate)||null), american:String(l.american||l.odds||""), prob:(l.prob!=null?l.prob:null), hit:null };
  });
}
function dlMapSaved(list){
  return (list||[]).slice().sort(function(a,b){return (b.savedAt||0)-(a.savedAt||0);}).map(function(p){
    var res=(p.result||"pending");
    var st=res==="win"?"WON":(res==="loss"?"LOST":"PENDING");
    var stc=res==="win"?POS:(res==="loss"?WARN:GOLD);
    var stbg=res==="win"?"rgba(53,208,192,.14)":(res==="loss"?"rgba(255,107,107,.14)":"rgba(255,194,77,.14)");
    var legs=p.legData||[];
    var done=legs.filter(function(l){return l.hit!=null;}).length;
    var title=p.title||legs.map(function(l){return (l.player||"")+(l.mk?" \u2014 "+String(l.mk).toUpperCase():"");}).join(" \u00b7 ");
    var stake=(p.stake!=null?(+p.stake||0):0);
    var when=p.gradedAt?"graded":(res==="pending"?(done+"/"+legs.length+" final"):"saved");
    var profit=res==="win"?(stake*(dlDec(p.odds)-1)):(res==="loss"?-stake:0);
    var clvNum=(p.clv!=null?(+p.clv):null);
    return { st:st, stc:stc, stbg:stbg, t:title, d:(legs.length+" legs \u00b7 $"+stake+" \u00b7 "+when), clv:(clvNum!=null?("CLV "+(clvNum>=0?"+":"")+clvNum.toFixed(1)):null), clvc:(clvNum!=null&&clvNum>=0?POS:"#7b8597"), clvbg:"rgba(53,208,192,.13)", odds:String(p.odds||""), oddsc:AC, sub:(p.sub||(res==="pending"?"awaiting final":res)), result:res, stakeNum:stake, profitNum:profit, clvNum:clvNum };
  });
}
function dlSync(opts){
  opts=opts||{};
  if(typeof CFG==="undefined"||!CFG||!CFG.backend) return;
  fetch(CFG.backend+"/api/state?user="+dlUserKey(),{method:"GET",mode:"cors"}).then(function(r){return r.ok?r.json():null;}).then(function(stt){
    if(stt&&stt.savedParlays){ SAVED=dlMapSaved(stt.savedParlays); render(); }
    if(opts.grade){ fetch(CFG.backend+"/api/grade?user="+dlUserKey(),{method:"POST",mode:"cors",headers:{"Content-Type":"application/json"},body:"{}"}).then(function(r){return r.ok?r.json():null;}).then(function(g){ if(g&&g.state&&g.state.savedParlays){ SAVED=dlMapSaved(g.state.savedParlays); render(); } }).catch(function(){}); }
  }).catch(function(){});
}

function computeTrackKpis(){
  var graded=SAVED.filter(function(p){return p.result==="win"||p.result==="loss"||p.st==="WON"||p.st==="LOST";});
  var wins=graded.filter(function(p){return p.result==="win"||p.st==="WON";}).length;
  var losses=graded.filter(function(p){return p.result==="loss"||p.st==="LOST";}).length;
  var clvs=[]; SAVED.forEach(function(p){ if(p.clvNum!=null) clvs.push(p.clvNum); });
  var beat=clvs.length?Math.round(clvs.filter(function(v){return v>0;}).length/clvs.length*100):null;
  var avg=clvs.length?(clvs.reduce(function(a,b){return a+b;},0)/clvs.length):null;
  var stake=0, profit=0;
  graded.forEach(function(p){ stake+=(p.stakeNum||0); profit+=(p.profitNum||0); });
  var roi=(stake)?(profit/stake*100):null;
  var em="\u2014";
  return [
    {k:"BEAT THE CLOSE",v:(beat===null?em:beat+"%"),s:(clvs.length?clvs.length+" graded legs":"closing line not captured"),vc:(beat!==null&&beat>=50?POS:null)},
    {k:"AVG CLV",v:(avg===null?em:(avg>=0?"+":"")+avg.toFixed(1)),s:(clvs.length?"prob points":"closing line not captured"),vc:(avg!==null&&avg>=0?POS:null)},
    {k:"RECORD",v:(graded.length?wins+"\u2013"+losses:em),s:(graded.length?"graded parlays":"no graded parlays yet")},
    {k:"ROI",v:(roi===null?em:(roi>=0?"+":"")+roi.toFixed(1)+"%"),s:(stake?"on $"+Math.round(stake)+" staked":"on $0 staked"),vc:(roi!==null&&roi>=0?POS:null)}
  ];
}
