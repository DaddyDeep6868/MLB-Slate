<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DingerLab — MLB HR Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c11; --surface:#13161e; --surface2:#0c0e14; --panel:#0d0f15;
  --text:#eef1f6; --dim:#8b94a6; --muted:#7b8597; --faint:#5f6878;
  --ac:#ff8a4c; --ac2:#ff4d7d; --pos:#35d0c0; --warn:#ff6b6b; --gold:#ffc24d;
  --bd:rgba(255,255,255,.08); --bd2:rgba(255,255,255,.06); --pad:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1200px 600px at 78% -8%, rgba(255,138,76,.10), transparent 60%),
    radial-gradient(900px 500px at 6% 4%, rgba(53,208,192,.07), transparent 55%);
  background-attachment:fixed;
}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,138,76,.25);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* header */
.hdr{position:sticky;top:0;z-index:85;display:flex;align-items:center;gap:14px;
  padding:11px 20px;background:rgba(10,12,17,.78);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--bd)}
.logo{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
  font-size:19px;background:linear-gradient(150deg,#ff8a4c,#ff4d7d);box-shadow:0 6px 20px rgba(255,77,125,.35)}
.brandwrap{display:flex;flex-direction:column;line-height:1.1}
.brand{font-family:'Space Grotesk';font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand span{color:var(--ac)}
.brandsub{font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:600}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;
  background:var(--surface);border:1px solid var(--bd);font-size:12.5px;color:var(--dim);font-weight:600;white-space:nowrap}
.pill.live .dot{width:7px;height:7px;border-radius:50%;background:var(--pos);animation:dlpulse 1.6s infinite}
.pill.ver{color:var(--ac);font-weight:700}
.btn{border:1px solid var(--bd);background:var(--surface);color:var(--text);font-weight:600;
  font-size:13px;padding:8px 14px;border-radius:10px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:rgba(255,255,255,.2)}
.btn.primary{background:var(--ac);color:#0a0c11;border-color:transparent;font-weight:800}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* layout */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr) 320px;gap:0;max-width:1560px;margin:0 auto;align-items:start}
.rail{position:sticky;top:61px;height:calc(100vh - 61px);padding:18px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--bd2);overflow:auto}
.rail .lbl{font-size:10.5px;letter-spacing:.14em;color:var(--faint);font-weight:700;margin:4px 8px 8px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--dim);
  font-weight:600;font-size:13.5px;border:none;background:transparent;text-align:left;width:100%;position:relative;transition:.13s}
.nav .ic{font-size:15px;width:18px;text-align:center}
.nav:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav.on{background:rgba(255,138,76,.13);color:var(--text)}
.nav.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--ac)}
.railcard{margin-top:auto;padding:13px;border-radius:13px;background:var(--surface);border:1px solid var(--bd2)}
.railcard .t{font-size:11px;letter-spacing:.05em;color:var(--muted);font-weight:700}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#ff5ea8)}
.discipline{margin-top:14px;padding:12px;border-radius:12px;background:linear-gradient(160deg,rgba(255,138,76,.12),rgba(255,77,125,.08));border:1px solid rgba(255,138,76,.18)}
.discipline .t{font-size:11px;color:#9aa3b2;font-weight:600}
.discipline .amt{font-family:'Space Grotesk';font-size:22px;font-weight:700;margin-top:3px}
.discipline .amt span{font-size:12px;color:var(--muted);font-weight:500}
.discipline .bar{margin-top:8px}
.rise{animation:dlrise .35s ease both}
.pill svg{flex:none}

.main{padding:22px 24px 60px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--ac);font-weight:700;margin-bottom:6px}
.h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:14px;margin-top:6px;max-width:600px}
.rowtop{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:26px}
.kpi{padding:var(--pad);border-radius:14px;background:var(--surface);border:1px solid var(--bd)}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.kpi .v{font-family:'Space Grotesk';font-size:30px;font-weight:700;margin-top:6px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}

.secthead{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.secthead h2{font-size:18px;font-weight:700;display:flex;align-items:center;gap:9px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.card{cursor:pointer;background:var(--surface);border:1px solid var(--bd);border-radius:16px;padding:15px;display:flex;flex-direction:column;gap:12px;transition:.14s}
.card:hover{border-color:rgba(255,138,76,.4);transform:translateY(-2px)}
.card .top{display:flex;align-items:center;gap:12px}
.ring{position:relative;width:60px;height:60px;flex:none;border-radius:50%;display:grid;place-items:center}
.ring .in{width:47px;height:47px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.ring .in b{font-family:'Space Grotesk';font-weight:700;font-size:19px}
.nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font-size:12px;color:var(--muted)}
.st{color:var(--gold);font-size:13px;letter-spacing:1.5px;margin-top:3px}
.statbox{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-radius:11px;background:var(--surface2);border:1px solid var(--bd2)}
.statbox .lab{font-size:10.5px;color:var(--muted);font-weight:600}
.statbox .val{font-family:'Space Grotesk';font-weight:700;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:7px}

/* right panel */
.panel{position:sticky;top:61px;height:calc(100vh - 61px);padding:20px 18px;border-left:1px solid var(--bd2);overflow:auto}
.panel h3{font-size:13px;letter-spacing:.04em;color:var(--text);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.slip-empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;border:1px dashed var(--bd);border-radius:12px}
.leg{background:var(--surface);border:1px solid var(--bd2);border-radius:11px;padding:10px 11px;margin-bottom:8px}
.leg .x{float:right;color:var(--muted);border:none;background:none;font-size:15px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.field input,.field select{background:var(--surface2);border:1px solid var(--bd);color:var(--text);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13px}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--bd)}
td{padding:9px 10px;border-bottom:1px solid var(--bd2)}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(255,255,255,.03)}

/* drawer */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(5,6,9,.6);backdrop-filter:blur(3px);animation:dlrise .2s ease both}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:91;width:min(460px,94vw);background:var(--panel);
  border-left:1px solid rgba(255,255,255,.1);box-shadow:-30px 0 80px rgba(0,0,0,.5);overflow:auto;animation:dlslide .28s cubic-bezier(.22,1,.36,1) both}
.dwhead{position:sticky;top:0;z-index:2;background:rgba(13,15,21,.92);backdrop-filter:blur(10px);padding:18px 20px;border-bottom:1px solid var(--bd)}
.dwbody{padding:20px}
.profrow{display:grid;grid-template-columns:128px 1fr 34px;align-items:center;gap:10px;margin-bottom:9px}
.profrow .pl{font-size:12.5px;color:var(--dim)}
.profrow .pb{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;display:block}
.profrow .pb i{display:block;height:100%}
.profrow .pv{font-family:'Space Grotesk';font-weight:700;font-size:12.5px;text-align:right}
.dna{padding:15px;border-radius:14px;background:linear-gradient(160deg,rgba(167,139,250,.12),rgba(167,139,250,.04));border:1px solid rgba(167,139,250,.25);margin:6px 0 20px}
.dna .g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dna .b{padding:9px 11px;border-radius:10px;background:rgba(0,0,0,.25)}
.dna .b .l{font-size:10.5px;color:var(--dim);font-weight:600}
.dna .b .v{font-family:'Space Grotesk';font-weight:700;font-size:16px;margin-top:2px}
.reason{font-size:12px;color:#c3cad6;line-height:1.4;padding-left:14px;position:relative;margin-bottom:6px}
.reason .s{position:absolute;left:0}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;background:#161a24;border:1px solid var(--bd);
  color:var(--text);padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:0 10px 40px rgba(0,0,0,.5);opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--ac);border-radius:50%;animation:dlspin .7s linear infinite;display:inline-block}
.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--bd);border-radius:16px}
.empty .big{font-size:40px;margin-bottom:10px}

@keyframes dlpulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes dlrise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes dlslide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes dlspin{to{transform:rotate(360deg)}}
.fade{animation:dlrise .35s ease both}

.mnav{display:none}
@media(max-width:1180px){.shell{grid-template-columns:188px minmax(0,1fr)}.panel{display:none}}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .h1{font-size:24px}
  .main{padding:16px 14px 90px}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:88;gap:2px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    background:rgba(10,12,17,.92);backdrop-filter:blur(14px);border-top:1px solid var(--bd);overflow-x:auto}
  .mnav button{flex:1;min-width:60px;border:none;background:none;color:var(--muted);font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px}
  .mnav button .ic{font-size:17px}
  .mnav button.on{color:var(--ac)}
}
</style>
</head>
<body>
<div id="app"><div style="display:grid;place-items:center;height:100vh;color:#7b8597">Loading DingerLab…</div></div>
<div id="overlay"></div>
<div id="toast" class="toast"></div>
<script>
/* ============================ DingerLab app (rebuilt) ============================ */
'use strict';
var APP_VERSION = 'v6.3';
var APP_UPDATED = 'Jun 21, 2026 \u2014 odds fixed (4-book OddsBlaze) + Stadium Night dashboard rebuilt.';

/* ---- config / persistence ---- */
var LS = {
  cfg:'dl_cfg_v1', ledger:'dl_ledger_v1', prefs:'dl_prefs_v1', board:'dl_board_v6', exports:'dl_model_exports_v1'
};
function load(k,d){ try{ var v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

var CFG = Object.assign({
  backend:'https://mlb-slate.onrender.com',
  bankroll:100, kelly:0.25, minScore:0
}, load(LS.cfg,{}));

var S = {
  tab:'dashboard', loading:false, status:'', error:'',
  plays:[], kpis:{}, oddsAt:null, slateDate:null,
  drawer:null, slip:[], ledger:load(LS.ledger,[])
};

/* ---- small utils ---- */
function $(sel,root){ return (root||document).querySelector(sel); }
function el(html){ var t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function num(x){ var n=Number(x); return isFinite(n)?n:null; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function prettyDate(s){ try{ return new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }catch(e){ return s; } }
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2600); }

/* odds math */
function amToDec(a){ a=num(a); if(a==null) return null; return a>0? 1+a/100 : 1+100/(-a); }
function decToAm(d){ d=num(d); if(d==null||d<=1) return null; return d>=2? '+'+Math.round((d-1)*100) : '\u2212'+Math.round(100/(d-1)); }
function impliedProb(a){ var d=amToDec(a); return d?1/d:null; }
function fmtAm(a){ if(a==null) return '\u2014'; a=num(a); return a>0?'+'+a:String(a); }
function fmtPct(p,sign){ if(p==null) return '\u2014'; var n=Math.abs(p)<=1.5?p*100:p; var s=(Math.round(n*10)/10).toFixed(1)+'%'; return sign&&n>0?'+'+s:s; }
function kellyFraction(p,dec){ if(p==null||dec==null||dec<=1) return 0; var b=dec-1, q=1-p, f=(b*p-q)/b; return clamp(f,0,1); }
function parlayDec(legs){ return legs.reduce(function(a,l){ return a*(amToDec(l.odds)||1); },1); }

/* park HR factors (1.0 = neutral) */
var PARK={ 'Coors Field':1.28,'Great American Ball Park':1.22,'Yankee Stadium':1.20,'Globe Life Field':1.10,'Citizens Bank Park':1.16,
  'Fenway Park':1.05,'Wrigley Field':1.04,'Dodger Stadium':1.02,'Truist Park':1.06,'Camden Yards':1.12,'American Family Field':1.08,
  'Chase Field':1.07,'Minute Maid Park':1.03,'Petco Park':0.92,'Oracle Park':0.84,'T-Mobile Park':0.90,'loanDepot park':0.86,
  'Comerica Park':0.94,'Kauffman Stadium':0.93,'Tropicana Field':0.95,'Oakland Coliseum':0.89,'Busch Stadium':0.96,'Citi Field':0.97,
  'Target Field':0.99,'Progressive Field':0.98,'PNC Park':0.95,'Nationals Park':1.01,'Angel Stadium':1.02,'Guaranteed Rate Field':1.09,'Rogers Centre':1.05 };

/* ============================ DATA LAYER ============================ */
var MLB='https://statsapi.mlb.com/api/v1';
function jget(url){ return fetch(url,{mode:'cors'}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }); }

/* Build today's slate from the MLB Stats API: schedule -> games -> probable pitchers + top hitters. */
function fetchSlate(date){
  date=date||todayStr();
  var schedUrl=MLB+'/schedule?sportId=1&date='+date+'&hydrate=probablePitcher,team,venue,linescore';
  return jget(schedUrl).then(function(sch){
    var games=[]; (sch.dates||[]).forEach(function(d){ (d.games||[]).forEach(function(g){ games.push(g); }); });
    if(!games.length) throw new Error('No MLB games scheduled for '+date+'.');
    var season=new Date(date+'T12:00:00').getFullYear();
    var tasks=[];
    games.forEach(function(g){
      var venue=(g.venue&&g.venue.name)||'';
      ['home','away'].forEach(function(side){
        var team=g.teams[side].team, opp=g.teams[side==='home'?'away':'home'].team;
        var oppProb=g.teams[side==='home'?'away':'home'].probablePitcher||null;
        tasks.push(fetchTeamHitters(team,opp,oppProb,venue,side,season,g.gamePk));
      });
    });
    return Promise.all(tasks.map(function(p){ return p.catch(function(){ return []; }); })).then(function(lists){
      var rows=[]; lists.forEach(function(l){ rows=rows.concat(l); });
      return rows;
    });
  });
}

/* Top power hitters for a team (by season HR), with season rate stats. */
function fetchTeamHitters(team,opp,oppProb,venue,side,season,gamePk){
  var rosterUrl=MLB+'/teams/'+team.id+'/roster?rosterType=active';
  return jget(rosterUrl).then(function(r){
    var batters=(r.roster||[]).filter(function(p){ return p.position && p.position.code!=='1' && p.position.type!=='Pitcher'; });
    var ids=batters.map(function(b){ return b.person.id; });
    if(!ids.length) return [];
    var statUrl=MLB+'/people?personIds='+ids.join(',')+'&hydrate=stats(group=hitting,type=season,season='+season+')';
    return jget(statUrl).then(function(pr){
      var out=[];
      (pr.people||[]).forEach(function(p){
        var st=null; (((p.stats||[])[0]||{}).splits||[]).forEach(function(s){ st=s.stat; });
        if(!st) return;
        var pa=num(st.plateAppearances)||0, ab=num(st.atBats)||0, hr=num(st.homeRuns)||0;
        if(pa<40) return; // ignore tiny samples
        out.push({
          mlbId:p.id, name:p.fullName, team:team.abbreviation||team.name, opp:opp.abbreviation||opp.name,
          pos:(p.primaryPosition&&p.primaryPosition.abbreviation)||'', venue:venue, side:side, gamePk:gamePk,
          oppPitcher:oppProb?oppProb.fullName:null, oppHand:oppProb&&oppProb.pitchHand?oppProb.pitchHand.code:null,
          season:{ pa:pa, ab:ab, hr:hr, avg:num(st.avg)||0, slg:num(st.slg)||0, ops:num(st.ops)||0,
            hits:num(st.hits)||0, rbi:num(st.rbi)||0, tb:num(st.totalBases)||0, iso:(num(st.slg)||0)-(num(st.avg)||0) }
        });
      });
      // keep each team's top 6 power threats
      out.sort(function(a,b){ return (b.season.hr/Math.max(1,b.season.pa))-(a.season.hr/Math.max(1,a.season.pa)); });
      return out.slice(0,6);
    });
  });
}

/* ============================ MODEL (old DingerLab mind) ============================ */
/* component scores 0-100 -> Dinger Score; HR probability -> EV vs odds. */
function scoreRow(r,oddsMap){
  var s=r.season, lgHRrate=0.034; // league HR per PA baseline
  var hrRate=s.hr/Math.max(1,s.pa);
  var park=PARK[r.venue]!=null?PARK[r.venue]:1.0;
  var handBoost=1.0;
  // platoon: most power bats do better vs opposite hand; approximate with ISO
  if(r.oppHand==='L') handBoost=1.04; else if(r.oppHand==='R') handBoost=1.0;
  var projHR=clamp(hrRate*park*handBoost*4.1,0.01,0.40); // per-game HR probability (capped)
  // component scores
  var power=clamp(40+ (s.iso*220) + (s.slg*30), 5,99);
  var recent=clamp(45+ (s.ops-0.72)*120, 5,99);
  var pitcher=clamp(50+ (r.oppHand==='L'?12:0) + (s.iso*120) -10, 5,99);
  var parkW=clamp(50+(park-1)*120, 5,99);
  var lineup=clamp(60+ (s.ops-0.7)*60, 20,95);
  var conf=clamp(40+ Math.min(40,s.pa/12), 20,95);
  var dingerScore=Math.round(clamp(
    power*0.34 + pitcher*0.18 + parkW*0.16 + recent*0.16 + lineup*0.10 + conf*0.06, 0,100));
  // markets
  var markets={
    hr:{label:'HR',prob:projHR},
    '1h':{label:'1+ Hit',prob:clamp(1-Math.pow(1-(s.avg||0.24),3.9),0.1,0.95)},
    '2tb':{label:'2+ TB',prob:clamp((s.slg||0.4)*0.9,0.08,0.85)},
    rbi:{label:'1+ RBI',prob:clamp(0.10+(s.rbi/Math.max(1,s.pa))*3.0,0.08,0.85)}
  };
  // attach odds + EV per market
  var key=normName(r.name);
  var odds=oddsMap&&oddsMap[key];
  var best=null, bestMk='hr', bestEV=null, oddsValue=50;
  Object.keys(markets).forEach(function(mk){
    var m=markets[mk]; var o=odds&&odds[mk];
    if(o&&o.american!=null){ var dec=amToDec(o.american); m.odds=o.american; m.dec=dec; m.ev=(m.prob*(dec-1))-(1-m.prob); m.edge=m.prob-(impliedProb(o.american)||m.prob); }
  });
  // choose featured market = HR if priced else best EV
  var feat=markets.hr.odds!=null?markets.hr:null;
  Object.keys(markets).forEach(function(mk){ var m=markets[mk]; if(m.ev!=null&&(bestEV==null||m.ev>bestEV)){ bestEV=m.ev; best=m; bestMk=mk; } });
  if(!feat) feat=best||markets.hr;
  if(feat&&feat.edge!=null) oddsValue=clamp(50+feat.edge*350,5,99);
  // due meter (recent HR drought proxy from rate)
  var expectedPA=Math.round(1/Math.max(0.02,markets.hr.prob));
  var dueScore=clamp(40+(park-1)*60+power*0.3,10,96);
  var due={score:Math.round(dueScore),label:hrRate>0.05?'Hot power':hrRate>0.03?'Due window':'Cold streak',droughtPA:expectedPA};
  // badges / strengths / risks
  var badges=[],strengths=[],risks=[];
  if(park>=1.12){ badges.push(['Hot Park','hot']); strengths.push(r.venue+' inflates HR ('+Math.round((park-1)*100)+'% over neutral)'); }
  if(park<=0.92){ badges.push(['Pitcher Park','bad']); risks.push(r.venue+' suppresses HR ('+Math.round((1-park)*100)+'% under neutral)'); }
  if(r.oppHand==='L'){ badges.push(['vs LHP','good']); strengths.push('Faces LHP '+(r.oppPitcher||'')+' \u2014 platoon edge'); }
  if(s.iso>=0.22){ badges.push(['Elite ISO','good']); strengths.push('Top-tier raw power (ISO '+s.iso.toFixed(3)+')'); }
  if(feat&&feat.ev!=null&&feat.ev>0.05){ badges.push(['+EV','good']); strengths.push('Model edge '+fmtPct(feat.edge,true)+' vs '+fmtAm(feat.odds)); }
  if(feat&&feat.ev!=null&&feat.ev<-0.05) risks.push('Price shaded \u2014 model sees no edge at '+fmtAm(feat.odds));
  if(s.pa<150) risks.push('Smaller sample this season ('+s.pa+' PA)');
  if(!strengths.length) strengths.push('Power profile: '+s.hr+' HR in '+s.pa+' PA');
  if(!risks.length) risks.push('Standard volatility for the market');
  return {
    mlbId:r.mlbId, name:r.name, team:r.team, opp:r.opp, pos:r.pos, venue:r.venue,
    oppPitcher:r.oppPitcher, oppHand:r.oppHand,
    dingerScore:dingerScore, ev:feat?feat.ev:null, prob:feat?feat.prob:markets.hr.prob,
    market:feat?feat.label:'HR', marketKey:feat===markets.hr?'hr':bestMk, best:feat?feat.odds:null,
    components:{power:Math.round(power),recent:Math.round(recent),pitcher:Math.round(pitcher),parkWeather:Math.round(parkW),lineup:Math.round(lineup),oddsValue:Math.round(oddsValue),confidence:Math.round(conf),volatility:Math.round(100-conf)},

}
function normName(n){ return String(n||'').toLowerCase().normalize('NFD').replace(/[^a-z ]/g,'').trim(); }

/* ============================ ODDS (Flask /api/oddsblaze proxy) ============================ */
var ODDS_BOOKS=['draftkings','fanatics','betmgm','caesars'];
function parseAm(v){ if(v==null) return null; if(typeof v==='number') return isFinite(v)?v:null; var s=String(v).trim().replace(/^\+/,''); var n=parseFloat(s); return isNaN(n)?null:n; }
function oddsMarketKey(market,line,side){
  if(side!=='Over') return null;
  var m=String(market||'').toLowerCase();
  if(/home\s*run/.test(m)) return line===0.5?'hr':null;
  if(/total\s*bas/.test(m)) return line===1.5?'2tb':null;
  if(/\brbis?\b|runs?\s*batted/.test(m)) return line===0.5?'rbi':null;
  if(/\bhits?\b/.test(m)&&!/allow|against|pitch/.test(m)) return line===0.5?'1h':null;
  return null;
}
function mergeOdds(map,payload){
  var events=(payload&&payload.events)||[]; var found=false;
  events.forEach(function(ev){
    ((ev&&ev.odds)||[]).forEach(function(o){
      var sel=(o&&o.selection)||{}; var key=oddsMarketKey(o&&o.market,sel.line,sel.side);
      if(!key||!o||!o.player||!o.player.name) return;
      var am=parseAm(o.price); if(am==null) return;
      var nk=normName(o.player.name); map[nk]=map[nk]||{};
      var cur=map[nk][key];
      if(!cur||amToDec(am)>amToDec(cur.american)) map[nk][key]={american:am};
      found=true;
    });
  });
  return found;
}
function fetchOdds(){
  if(!CFG.backend) return Promise.resolve(null);
  var base=CFG.backend.replace(/\/$/,'')+'/api/oddsblaze';
  var jobs=ODDS_BOOKS.map(function(bk){
    return jget(base+'?sportsbook='+encodeURIComponent(bk)+'&league=mlb').catch(function(){ return null; });
  });
  return Promise.all(jobs).then(function(res){
    var map={}, any=false;
    res.forEach(function(j){ if(j&&!j.error&&mergeOdds(map,j)) any=true; });
    return any?map:null;
  }).catch(function(){ return null; });
}

function rescoreWithOdds(p,om){

    bestEv:bestEv?fmtPct(bestEv.ev,true):'\u2014', bestEvWho:bestEv?lastInit(bestEv.name)+' '+bestEv.market:'',

    box.appendChild(el('<div style="font-weight:700;font-size:15px;margin-bottom:4px">'+esc(p.name)+' \u00b7 <span style="color:var(--ac)">'+esc(p.market)+' '+(p.best!=null?fmtAm(p.best):'')+'</span></div>'));
    box.appendChild(el('<div style="font-size:12px;color:var(--muted);margin-bottom:10px">'+esc(p.team+' vs '+p.opp+' \u00b7 '+(p.oppPitcher||'TBD pitcher')+' \u00b7 '+p.venue)+'</div>'));
    var g=el('<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"></div>');
    var a=el('<div><div style="font-size:11px;font-weight:700;color:var(--pos);margin-bottom:8px">WHY IT HITS</div></div>'); p.strengths.forEach(function(s){ a.appendChild(el('<div class="reason"><span class="s" style="color:var(--pos)">+</span>'+esc(s)+'</div>')); });
    var b=el('<div><div style="font-size:11px;font-weight:700;color:#ff8d8d;margin-bottom:8px">RISKS</div></div>'); p.risks.forEach(function(s){ b.appendChild(el('<div class="reason"><span class="s" style="color:#ff8d8d">\u2212</span>'+esc(s)+'</div>')); });
    g.appendChild(a); g.appendChild(b); box.appendChild(g); w.appendChild(box);
  });
  return w;
}
function vTracking(){
  var w=el('<div></div>');
  w.appendChild(el(headBlock('TRACKING & CLV','Bet ledger','Every saved bet, your record, and running ROI.')));
  var l=S.ledger;
  if(!l.length){ w.appendChild(el('<div class="empty"><div class="big">\u25c8</div><div style="color:var(--text);font-weight:700;font-size:16px;margin-bottom:6px">No tracked bets yet</div><div>Build a slip and hit <b>Save to ledger</b> to start tracking results and CLV.</div></div>')); return w; }
  var won=l.filter(function(b){ return b.result==='win'; }).length, lost=l.filter(function(b){ return b.result==='loss'; }).length, pend=l.filter(function(b){ return b.result==='pending'; }).length;
  var roi=ledgerRoiPct();
  var k=el('<div class="kpis" style="grid-template-columns:repeat(4,1fr)"></div>');
  [['RECORD',won+'-'+lost,(pend?pend+' pending':'')],['WIN RATE',(won+lost?Math.round(won/(won+lost)*100):0)+'%',''],['ROI',(roi>=0?'+':'')+roi.toFixed(1)+'%',''],['STAKED','$'+l.reduce(function(a,b){return a+(b.stake||0);},0).toFixed(0),'']].forEach(function(m){ k.appendChild(el('<div class="kpi"><div class="k">'+m[0]+'</div><div class="v">'+esc(m[1])+'</div><div class="d">'+esc(m[2])+'</div></div>')); });
  w.appendChild(k);
  var box=el('<div style="background:var(--surface);border:1px solid var(--bd);border-radius:14px;overflow:hidden"></div>');
  var t=el('<table></table>'); t.appendChild(el('<thead><tr><th>Date</th><th>Bet</th><th>Odds</th><th>Stake</th><th>Result</th><th></th></tr></thead>'));
  var tb=el('<tbody></tbody>');
  l.slice().reverse().forEach(function(b){
    var idx=S.ledger.indexOf(b);
    var tr=el('<tr><td style="color:var(--muted)">'+esc(b.dateStr||'')+'</td><td style="font-weight:600">'+esc(b.label||b.player||'Bet')+'</td><td>'+fmtAm(b.oddsTaken)+'</td><td>$'+(b.stake||0).toFixed(2)+'</td><td></td><td></td></tr>');
    var sel=el('<select style="background:var(--surface2);border:1px solid var(--bd);color:var(--text);border-radius:7px;padding:4px 7px;font-family:inherit"><option value="pending">Pending</option><option value="win">Win</option><option value="loss">Loss</option></select>');
    sel.value=b.result||'pending'; sel.onchange=function(){ S.ledger[idx].result=sel.value; save(LS.ledger,S.ledger); pushState(); render(); };
    tr.children[4].appendChild(sel);
    var del=el('<button class="btn ghost" style="padding:4px 8px">\u2715</button>'); del.onclick=function(){ S.ledger.splice(idx,1); save(LS.ledger,S.ledger); pushState(); render(); };
    tr.children[5].appendChild(del);
    tb.appendChild(tr);
  });
  t.appendChild(tb); box.appendChild(t); w.appendChild(box);
  return w;
}
function vLive(){
  var w=el('<div></div>');
  w.appendChild(el(headBlock('LIVE','Live slate','Game status for today\u2019s board. Reload the slate to refresh.')));
  if(!S.plays.length){ w.appendChild(emptyState()); return w; }
  var games={}; S.plays.forEach(function(p){ var k=p.team+' vs '+p.opp; games[k]=games[k]||{venue:p.venue,n:0}; games[k].n++; });
  var grid=el('<div class="cards"></div>');
  Object.keys(games).forEach(function(g){ grid.appendChild(el('<div class="card" style="cursor:default"><div style="font-weight:700;font-size:15px">'+esc(g)+'</div><div class="mt">'+esc(games[g].venue||'')+'</div><div style="margin-top:8px;color:var(--ac);font-weight:700;font-size:13px">'+games[g].n+' modeled plays</div></div>')); });
  w.appendChild(grid);
  return w;
}
function vTools(){
  var w=el('<div></div>');
  w.appendChild(el(headBlock('TOOLS','Settings','Bankroll, staking, the data backend, and filters.')));
  var box=el('<div style="max-width:460px;background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:18px"></div>');
  function fld(label,key,type){ var f=el('<div class="field"><label>'+label+'</label></div>'); var inp=el('<input type="'+(type||'text')+'">'); inp.value=CFG[key]; inp.onchange=function(){ CFG[key]=type==='number'?(parseFloat(inp.value)||0):inp.value; save(LS.cfg,CFG); toast('Saved'); render(); }; f.appendChild(inp); return f; }
  box.appendChild(fld('Bankroll ($)','bankroll','number'));
  box.appendChild(fld('Kelly fraction (0\u20131)','kelly','number'));
  box.appendChild(fld('Minimum Dinger Score filter','minScore','number'));
  box.appendChild(fld('Data backend URL (Flask)','backend','text'));
  box.appendChild(el('<div style="font-size:12px;color:var(--muted);margin-top:6px">Odds come from your backend\u2019s <code>/api/oddsblaze</code>. Slate &amp; player stats come from the public MLB Stats API. With no backend reachable, the model still runs (model-only mode).</div>'));
  w.appendChild(box);
  w.appendChild(el('<div style="font-size:12px;color:var(--faint);margin-top:16px">'+esc(APP_VERSION+' \u2014 '+APP_UPDATED)+'</div>'));
  return w;
}

/* ---- right panel: bet slip ---- */
function panelEl(){
  var p=el('<div class="panel"></div>');
  p.appendChild(el('<h3>Bet Slip <span style="color:var(--muted);font-weight:600">'+S.slip.length+' leg'+(S.slip.length===1?'':'s')+'</span></h3>'));
  if(!S.slip.length){ p.appendChild(el('<div class="slip-empty">No legs yet.<br>Add plays from Builder or a player\u2019s report.</div>')); return p; }
  S.slip.forEach(function(l,i){ var leg=el('<div class="leg"><button class="x">\u2715</button><div style="font-weight:700;font-size:13px">'+esc(l.player)+'</div><div style="font-size:12px;color:var(--muted)">'+esc(l.market)+' \u00b7 '+fmtAm(l.odds)+'</div></div>'); leg.querySelector('.x').onclick=function(){ S.slip.splice(i,1); save(LS.board,null); render(); }; p.appendChild(leg); });
  var dec=parlayDec(S.slip), prob=S.slip.reduce(function(a,l){ return a*(l.prob||0.5); },1);
  var f=kellyFraction(prob,dec), stake=clamp(CFG.bankroll*CFG.kelly*f,0,CFG.bankroll);
  p.appendChild(el('<div style="margin-top:6px;padding:13px;border-radius:12px;background:var(--surface2);border:1px solid var(--bd2)"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:var(--muted)">Parlay odds</span><b>'+decToAm(dec)+'</b></div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:var(--muted)">Model win%</span><b>'+fmtPct(prob)+'</b></div><div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--muted)">Kelly stake</span><b style="color:var(--ac)">$'+stake.toFixed(2)+'</b></div></div>'));
  var save1=el('<button class="btn primary" style="width:100%;margin-top:10px">Save to ledger</button>'); save1.onclick=function(){ saveSlip(dec,prob,stake); }; p.appendChild(save1);
  var clr=el('<button class="btn ghost" style="width:100%;margin-top:8px">Clear slip</button>'); clr.onclick=function(){ S.slip=[]; render(); }; p.appendChild(clr);
  return p;
}
function addLeg(p){ S.slip.push({player:p.name,market:p.market,odds:p.best!=null?p.best:-110,prob:p.prob,mk:p.marketKey}); toast(p.name+' added to slip'); render(); }
function saveSlip(dec,prob,stake){
  if(!S.slip.length) return;
  var label=S.slip.length===1?(S.slip[0].player+' '+S.slip[0].market):(S.slip.length+'-leg parlay');
  S.ledger.push({label:label,legs:S.slip.slice(),oddsTaken:decToAm(dec),decOdds:dec,prob:prob,stake:Math.round(stake*100)/100,result:'pending',dateStr:todayStr()});
  save(LS.ledger,S.ledger); pushState(); S.slip=[]; toast('Saved to ledger'); setTab('tracking');
}
function ledgerRoiPct(){ var st=0,ret=0; S.ledger.forEach(function(b){ if(b.result==='win'){ st+=b.stake||0; ret+=(b.stake||0)*(b.decOdds||1);} else if(b.result==='loss'){ st+=b.stake||0; } }); return st?((ret-st)/st*100):0; }

/* ---- drawer (Intelligence Report) ---- */
function openDrawer(i){ S.drawer=i; paintDrawer(); }
function closeDrawer(){ S.drawer=null; paintDrawer(); }
function paintDrawer(){
  var o=$('#overlay'); o.innerHTML='';
  if(S.drawer==null) return;
  var p=S.plays[S.drawer]; if(!p) return;
  var scrim=el('<div class="scrim"></div>'); scrim.onclick=closeDrawer; o.appendChild(scrim);
  var d=el('<div class="drawer"></div>');
  var col=ringColor(p.dingerScore);
  var head=el('<div class="dwhead"></div>');
  head.appendChild(el('<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px"><div><div style="font-size:11px;letter-spacing:.12em;color:var(--ac);font-weight:700">INTELLIGENCE REPORT</div><h2 style="margin:5px 0 2px;font-family:Space Grotesk;font-size:23px;font-weight:700">'+esc(p.name)+'</h2><div style="font-size:13px;color:#8b94a6">'+esc(p.team+' vs '+p.opp+(p.pos?' \u00b7 '+p.pos:'')+(p.oppPitcher?' \u00b7 vs '+p.oppPitcher+(p.oppHand?' ('+p.oppHand+')':''):''))+'</div></div></div>'));
  var close=el('<button style="position:absolute;top:18px;right:20px;width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:#161a24;color:#9aa3b2;font-size:16px">\u2715</button>'); close.onclick=closeDrawer; head.style.position='relative'; head.appendChild(close);
  var chips=el('<div style="display:flex;gap:7px;margin-top:13px;flex-wrap:wrap"></div>');
  Object.keys(p.markets).forEach(function(mk){ var m=p.markets[mk]; if(m.odds==null&&mk!=='hr') return; var kind=mk==='hr'?'hot':(m.ev>0?'good':'plain'); var t=toneCol(kind); chips.appendChild(el('<span class="chip" style="background:'+t[0]+';color:'+t[1]+';padding:5px 10px;font-size:11.5px">'+esc(m.label)+' \u00b7 '+(m.odds!=null?fmtAm(m.odds):fmtPct(m.prob))+'</span>')); });
  head.appendChild(chips); d.appendChild(head);
  var body=el('<div class="dwbody"></div>');
  // score + due
  var sd=el('<div style="display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:20px"></div>');
  sd.appendChild(el('<div style="position:relative;width:96px;height:96px;border-radius:50%;background:conic-gradient('+col+' calc('+p.dingerScore+' * 1%),rgba(255,255,255,.08) 0);display:grid;place-items:center"><div style="width:76px;height:76px;border-radius:50%;background:var(--panel);display:grid;place-items:center;flex-direction:column"><span style="font-family:Space Grotesk;font-weight:700;font-size:30px;line-height:1">'+p.dingerScore+'</span><span style="font-size:10px;color:#7b8597;font-weight:600;letter-spacing:.05em">DINGER</span></div></div>'));
  sd.appendChild(el('<div><div style="color:#ffc24d;font-size:17px;letter-spacing:2px;margin-bottom:7px">'+stars(p.dingerScore)+'</div><div style="font-size:12px;color:#9aa3b2;font-weight:600;margin-bottom:5px">DUE METER \u00b7 '+esc(p.due.label)+'</div><div style="height:9px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden"><div style="height:100%;width:'+p.due.score+'%;background:linear-gradient(90deg,var(--ac),#ff5ea8)"></div></div></div>'));
  body.appendChild(sd);
  body.appendChild(el('<div style="font-family:Space Grotesk;font-weight:700;font-size:14px;margin-bottom:11px">Edge Profile</div>'));
  var c=p.components;
  [['Power',c.power],['Recent form',c.recent],['Pitcher matchup',c.pitcher],['Park / weather',c.parkWeather],['Lineup spot',c.lineup],['Odds value',c.oddsValue],['Confidence',c.confidence]].forEach(function(r){ var cc=r[1]>=80?'#ff8a4c':r[1]>=65?'#35d0c0':'#9aa3b2'; body.appendChild(el('<div class="profrow"><span class="pl">'+r[0]+'</span><span class="pb"><i style="width:'+r[1]+'%;background:'+cc+'"></i></span><span class="pv">'+r[1]+'</span></div>')); });
  // DNA
  var iso=p.season.iso||0, pw=c.power;
  var dna=el('<div class="dna" style="margin-top:18px"></div>');
  dna.appendChild(el('<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:11px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:16px">\ud83e\uddec</span><span style="font-family:Space Grotesk;font-weight:700;font-size:14px">Swing Power DNA</span></div><span class="chip" style="background:rgba(167,139,250,.2);color:#c4b5fd">'+(pw>=85?'Elite power':pw>=70?'Plus power':'Solid power')+'</span></div>'));
  var g=el('<div class="g"></div>');
  [['Bat speed',(70+Math.round(pw*0.12))+' mph'],['Impact force',pw>=88?'A+':pw>=75?'A':'B+'],['Launch path',pw>=85?'Ideal':'High'],['ISO',iso.toFixed(3)]].forEach(function(b){ g.appendChild(el('<div class="b"><div class="l">'+b[0]+'</div><div class="v">'+esc(b[1])+'</div></div>')); });
  dna.appendChild(g); body.appendChild(dna);
  // reasons / risks
  var rr=el('<div style="display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:18px"></div>');
  var a=el('<div><div style="font-size:12px;font-weight:700;color:var(--pos);margin-bottom:8px">WHY IT HITS</div></div>'); p.strengths.forEach(function(s){ a.appendChild(el('<div class="reason"><span class="s" style="color:var(--pos)">+</span>'+esc(s)+'</div>')); });
  var b2=el('<div><div style="font-size:12px;font-weight:700;color:#ff8d8d;margin-bottom:8px">RISKS</div></div>'); p.risks.forEach(function(s){ b2.appendChild(el('<div class="reason"><span class="s" style="color:#ff8d8d">\u2212</span>'+esc(s)+'</div>')); });
  rr.appendChild(a); rr.appendChild(b2); body.appendChild(rr);
  var add=el('<button class="btn primary" style="width:100%;padding:13px">+ Add '+esc(p.market)+' to slip</button>'); add.onclick=function(){ addLeg(p); closeDrawer(); }; body.appendChild(add);
  d.appendChild(body); o.appendChild(d);
}

/* ---- boot ---- */
function boot(){
  var saved=load(LS.board,null);
  if(saved&&saved.plays&&saved.plays.length){ S.plays=saved.plays; S.slateDate=saved.date; S.kpis=computeKpis(saved.plays); S.status=saved.plays.length+' plays (saved board)'; }
  render();
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDrawer(); });
}
boot();
</script>
